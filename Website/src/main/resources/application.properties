server.port=${PORT:8082}
vaadin.launch-browser=false
# Nur das eigene Paket nach Vaadin-Klassen durchsuchen (schnellerer Start)
vaadin.allowed-packages=com.vaadin,org.vaadin,de.cachebox

# .env liegt neben der Jar (WorkingDirectory) oder am explizit angegebenen Pfad.
spring.config.import=optional:file:${WEBSITE_ENV_FILE:./.env}[.properties]
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
website.admin.username=${ADMIN_USER:}
website.admin.password=${ADMIN_PASSWORD:}
website.admin.remember-me-days=${ADMIN_REMEMBER_ME_DAYS:14}
website.analytics.directory=${ANALYTICS_DIRECTORY:./data}
website.analytics.geoip-database=${GEOIP_DATABASE:}
# Nur explizit vertraute direkte Proxies dürfen X-Forwarded-For liefern.
website.analytics.trusted-proxies=${ANALYTICS_TRUSTED_PROXIES:}
